services:
  postgres:
    # pgvector/pgvector:pg16 = 官方 postgres:16 + 預裝 pgvector 擴充 (RAG 向量檢索用)。
    # 與既有資料完全相容,只是多了 `CREATE EXTENSION vector` 的能力。
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dsas
      POSTGRES_PASSWORD: dsas
      POSTGRES_DB: dsas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dsas
      MINIO_ROOT_PASSWORD: dsasdsas
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
